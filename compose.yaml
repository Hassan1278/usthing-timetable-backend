# One API process: overlap locks and rate counters are currently process-local.
# Start: docker compose up --build -d --wait
# Stop without removing data: docker compose down
# docker compose down -v also removes the database volume and all its data.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: usthing-api:local
    init: true
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/template-api
      AUTH_SKIP: "false"
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-120}
      RATE_LIMIT_READ_MAX: ${RATE_LIMIT_READ_MAX:-120}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-30}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  reminders:
    image: usthing-api:local
    profiles: ["reminders"]
    init: true
    command: ["bun", "src/reminders/worker.ts"]
    environment:
      NODE_ENV: production
      EMAIL_DELIVERY_ENABLED: "true"
      MONGO_URI: mongodb://mongodb:27017/template-api
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: reminders@usthing.invalid
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3001'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.31.2
    profiles: ["reminders"]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:8.3.4
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
  mailpit_data:
